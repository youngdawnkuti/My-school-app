<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#db2777">
  <title>Active Quiz - Student Space</title>
  <style>
    :root {
      --pink-dark: #831843;
      --pink-main: #db2777;
      --pink-light: #fce7f3;
      --pink-border: #fbcfe8;
      --pink-bg: #fff0f5;
      --white: #ffffff;
      --green-bg: #dcfce7;
      --green-text: #15803d;
      --red-bg: #fee2e2;
      --red-text: #b91c1c;
      --font-readable: 'Fredoka', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-readable); }

    body {
      background-color: var(--pink-bg);
      min-height: 100vh;
      padding: 16px;
      color: var(--pink-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quiz-container {
      width: 100%;
      max-width: 600px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 4px 0;
    }

    .subject-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subject-icon {
      background: #0284c7;
      color: var(--white);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1.1;
      text-align: center;
    }

    .subject-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--pink-dark);
      text-transform: capitalize;
    }

    .timer-btn {
      background: var(--pink-main);
      color: var(--white);
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 10px rgba(219, 39, 119, 0.2);
    }

    .question-card {
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid var(--pink-border);
      box-shadow: 0 8px 20px rgba(219, 39, 119, 0.06);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .level-label, .counter-label {
      color: var(--pink-main);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--pink-dark);
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: var(--pink-bg);
      border: 2px solid var(--pink-border);
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--pink-dark);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .option-btn:hover { border-color: var(--pink-main); }

    .option-btn.correct {
      background: var(--green-bg) !important;
      border-color: var(--green-text) !important;
      color: var(--green-text) !important;
    }

    .option-btn.incorrect {
      background: var(--red-bg) !important;
      border-color: var(--red-text) !important;
      color: var(--red-text) !important;
    }

    .feedback-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
      margin-top: 16px;
    }

    .feedback-banner.correct {
      display: block;
      background: var(--green-bg);
      color: var(--green-text);
      border: 2px solid var(--green-text);
    }

    .feedback-banner.wrong {
      display: block;
      background: var(--red-bg);
      color: var(--red-text);
      border: 2px solid var(--red-text);
    }

    .explanation-card {
      display: none;
      background: var(--pink-bg);
      border: 2px dashed var(--pink-border);
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    .explanation-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--pink-dark);
      margin-bottom: 6px;
    }

    .explanation-text {
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--pink-dark);
      margin-bottom: 12px;
    }

    .handout-btn {
      display: inline-block;
      background: var(--white);
      color: var(--pink-main);
      border: 2px solid var(--pink-main);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
    }

    .next-btn {
      display: none;
      width: 100%;
      margin-top: 16px;
      background: var(--pink-main);
      color: var(--white);
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(219, 39, 119, 0.25);
    }

    .results-card {
      text-align: center;
      display: none;
      background: var(--white);
      border-radius: 20px;
      padding: 30px 20px;
      border: 2px solid var(--pink-border);
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--pink-bg);
      border: 4px solid var(--pink-main);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px auto;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--pink-dark);
    }

    .action-btn {
      display: inline-block;
      margin-top: 20px;
      background: var(--pink-main);
      color: var(--white);
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="quizScreen">
      <div class="header-bar">
        <div class="subject-title-group">
          <div class="subject-icon">1 2<br>3 4</div>
          <div class="subject-name" id="subjectName">Mathematics</div>
        </div>
        <div class="timer-btn" id="timeDisplay">⏱️ 15:00</div>
      </div>

      <div class="question-card">
        <div class="card-meta">
          <span class="level-label" id="levelLabel">Level 1</span>
          <span class="counter-label" id="counterLabel">Q 1/20</span>
        </div>

        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsGrid"></div>

        <div class="feedback-banner" id="feedbackBanner"></div>

        <div class="explanation-card" id="explanationCard">
          <div class="explanation-title">💡 Explanation</div>
          <div class="explanation-text" id="explanationText"></div>
          <button class="handout-btn" onclick="openHandout()">📖 View Handout</button>
        </div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question ➔</button>
      </div>
    </div>

    <div class="results-card" id="resultsScreen">
      <h2>🎉 Quiz Completed!</h2>
      <div class="score-circle" id="scoreCircle">0%</div>
      <p id="scoreBreakdown">You answered 0 out of 20 questions correctly.</p>
      <p id="unlockMsg" style="margin-top: 10px; font-weight: 700;"></p>
      <button class="action-btn" onclick="returnToHub()">Return to Subject Hub</button>
    </div>
  </div>

  <!-- Include questions loader script -->
  <script src="questions.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const subject = urlParams.get('subject') || 'mathematics';
      const level = parseInt(urlParams.get('level')) || 1;

      document.getElementById('subjectName').textContent = subject.replace('-', ' ');
      document.getElementById('levelLabel').textContent = `Level ${level}`;

      // Fallback question generator if fetchQuestionsForLevel isn't available
      function generateFallbackQuestions() {
        let list = [];
        for (let i = 1; i <= 20; i++) {
          list.push({
            q: `[${subject.toUpperCase()} L${level}] Question ${i}: What is ${i} + 1?`,
            options: [`${i}`, `${i + 1}`, `${i + 2}`, `${i + 3}`],
            answer: 1,
            explanation: `When you add 1 to ${i}, you get ${i + 1}.`
          });
        }
        return list;
      }

      const questions = (typeof fetchQuestionsForLevel === 'function') 
        ? fetchQuestionsForLevel(subject, level) 
        : generateFallbackQuestions();

      let currentIndex = 0;
      let score = 0;
      let canAnswer = true;

      let totalSeconds = 900;
      let timerInterval = setInterval(() => {
        let mins = Math.floor(totalSeconds / 60);
        let secs = totalSeconds % 60;
        secs = secs < 10 ? '0' + secs : secs;
        document.getElementById('timeDisplay').textContent = `⏱️ ${mins}:${secs}`;

        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          finishQuiz();
        }
        totalSeconds--;
      }, 1000);

      function renderQuestion() {
        if (currentIndex >= questions.length) {
          finishQuiz();
          return;
        }

        canAnswer = true;
        const item = questions[currentIndex];

        document.getElementById('feedbackBanner').className = 'feedback-banner';
        document.getElementById('explanationCard').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';

        document.getElementById('counterLabel').textContent = `Q ${currentIndex + 1}/${questions.length}`;
        document.getElementById('questionText').textContent = item.q;
        
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        item.options.forEach((optText, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = optText;
          btn.onclick = () => handleChoice(btn, idx, item.answer);
          grid.appendChild(btn);
        });
      }

      function handleChoice(selectedBtn, chosenIndex, correctIndex) {
        if (!canAnswer) return;
        canAnswer = false;

        const item = questions[currentIndex];
        const allBtns = document.querySelectorAll('.option-btn');
        const banner = document.getElementById('feedbackBanner');
        const expCard = document.getElementById('explanationCard');
        const nextBtn = document.getElementById('nextBtn');

        if (chosenIndex === correctIndex) {
          selectedBtn.classList.add('correct');
          banner.textContent = '✅ Correct!';
          banner.className = 'feedback-banner correct';
          score++;
        } else {
          selectedBtn.classList.add('incorrect');
          allBtns[correctIndex].classList.add('correct');
          banner.textContent = '❌ Wrong!';
          banner.className = 'feedback-banner wrong';
        }

        document.getElementById('explanationText').textContent = item.explanation;
        expCard.style.display = 'block';
        nextBtn.style.display = 'block';
      }

      window.nextQuestion = function() {
        currentIndex++;
        renderQuestion();
      };

      window.openHandout = function() {
        alert(`Opening study handout for ${subject.replace('-', ' ')}...`);
      };

      function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultsScreen').style.display = 'block';

        const finalPct = Math.round((score / questions.length) * 100);
        document.getElementById('scoreCircle').textContent = `${finalPct}%`;
        document.getElementById('scoreBreakdown').textContent = `You scored ${score} out of ${questions.length} questions correctly.`;

        saveProgress(finalPct);
      }

      function saveProgress(scorePct) {
        let progress = JSON.parse(localStorage.getItem('studentQuizProgress') || '{}');
        if (!progress[subject]) progress[subject] = {};
        if (!progress[subject][`level${level}`]) {
          progress[subject][`level${level}`] = { unlocked: true, highScore: 0, attempts: 0 };
        }

        let lvlRecord = progress[subject][`level${level}`];
        lvlRecord.attempts += 1;
        if (scorePct > lvlRecord.highScore) lvlRecord.highScore = scorePct;

        const unlockNotice = document.getElementById('unlockMsg');
        if (scorePct >= 80) {
          unlockNotice.textContent = `🌟 Level Cleared! Next level unlocked!`;
          unlockNotice.style.color = '#15803d';

          if (level < 10) {
            if (!progress[subject][`level${level + 1}`]) {
              progress[subject][`level${level + 1}`] = { unlocked: true, highScore: 0, attempts: 0 };
            } else {
              progress[subject][`level${level + 1}`].unlocked = true;
            }
          }
        } else {
          unlockNotice.textContent = `🔒 Pass mark is 80%. Retake to unlock next level!`;
          unlockNotice.style.color = '#b91c1c';
        }

        localStorage.setItem('studentQuizProgress', JSON.stringify(progress));
      }

      window.returnToHub = function() {
      window.location.href = 'mathematics.html'; // Change to your actual file name or URL
      };

      renderQuestion();
    });
  </script>
</body>
</html>
